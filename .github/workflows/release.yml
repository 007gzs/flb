name: release

on:
  push:
    tags:
      - v*
env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.vars.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Build frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Extract version from tag
        id: vars
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  cross_build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            bin: flb
            suffix: ""
          - target: aarch64-unknown-linux-musl
            bin: flb
            suffix: ""
          - target: x86_64-pc-windows-gnullvm
            bin: flb.exe
            suffix: ".exe"
          - target: x86_64-apple-darwin
            bin: flb
            suffix: ""
          - target: aarch64-apple-darwin
            bin: flb
            suffix: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
      - name: Build ${{ matrix.target }}
        env:
          TARGET: ${{ matrix.target }}
        run: |
          docker run --rm \
            -v "$(pwd):/code" \
            -w /code \
            -e TARGET \
            ghcr.io/rust-cross/cargo-zigbuild \
            bash -ec '
              rustup update stable
              rustup default stable
              rustup target add "$TARGET"
              apt-get update && apt-get install -y cmake
              cargo zigbuild --release --target "$TARGET"
            '
      - name: Package binary
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p dist
          src="target/${{ matrix.target }}/release/${{ matrix.bin }}"
          dest="dist/flb-${VERSION}-${{ matrix.target }}${{ matrix.suffix }}"
          cp -a "$src" "$dest"
          ls -lh "$dest"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-binaries-${{ matrix.target }}
          path: dist/
          retention-days: 1

  verify_cross_build:
    needs: [prepare, cross_build]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require all matrix jobs to succeed
        env:
          RESULT: ${{ needs.cross_build.result }}
        run: |
          echo "cross_build result: ${RESULT}"
          if [ "${RESULT}" != "success" ]; then
            echo "One or more architecture/OS builds failed; skip publish."
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-binaries-*
          merge-multiple: true
          path: dist/
      - name: Verify all packaged binaries exist
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          missing=0
          for name in \
            "flb-${VERSION}-x86_64-unknown-linux-musl" \
            "flb-${VERSION}-aarch64-unknown-linux-musl" \
            "flb-${VERSION}-x86_64-pc-windows-gnullvm.exe" \
            "flb-${VERSION}-x86_64-apple-darwin" \
            "flb-${VERSION}-aarch64-apple-darwin"
          do
            if [ ! -f "dist/${name}" ]; then
              echo "missing: ${name}"
              missing=1
            else
              ls -lh "dist/${name}"
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            echo "Packaging incomplete; skip publish."
            ls -la dist || true
            exit 1
          fi

  publish_release:
    needs: [prepare, verify_cross_build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-binaries-*
          merge-multiple: true
          path: dist/
      - name: Create release and upload assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -lh dist
          gh release create "v${{ needs.prepare.outputs.version }}" dist/* \
            --title "v${{ needs.prepare.outputs.version }}" \
            --generate-notes

  publish_docker_image:
    needs: [prepare, verify_cross_build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-binaries-*
          merge-multiple: true
          path: dist/
      - name: Map musl binaries to Docker TARGETARCH names
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          file=flb
          cp -a "dist/${file}-${VERSION}-x86_64-unknown-linux-musl" \
            "dist/${file}-${VERSION}-amd64-unknown-linux-musl"
          cp -a "dist/${file}-${VERSION}-aarch64-unknown-linux-musl" \
            "dist/${file}-${VERSION}-arm64-unknown-linux-musl"
          chmod +x \
            "dist/${file}-${VERSION}-amd64-unknown-linux-musl" \
            "dist/${file}-${VERSION}-arm64-unknown-linux-musl"
          ls -lh dist
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.publish
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            FILE=flb
            VERSION=${{ needs.prepare.outputs.version }}
          tags: |
            007gzs/flb:latest
            007gzs/flb:${{ needs.prepare.outputs.version }}
