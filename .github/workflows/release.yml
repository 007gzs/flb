name: release

on:
  push:
    tags:
      - v*
env:
  CARGO_TERM_COLOR: always

jobs:

  cross_build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.vars.outputs.version }}
    steps:
      - uses: actions/checkout@v3
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Build frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Extract version from tag
        id: vars
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Build Cross binaries
        run: |
          docker run --rm \
          -v "$(pwd):/code" \
          -w /code \
          -e VERSION="${{ steps.vars.outputs.version }}" \
          ghcr.io/rust-cross/cargo-zigbuild \
          bash -ec '
            rustup update stable
            rustup default stable
            rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl x86_64-pc-windows-gnullvm x86_64-apple-darwin aarch64-apple-darwin
            apt-get update && apt-get install -y cmake
            ls -la frontend/dist
            cargo zigbuild --release --target x86_64-unknown-linux-musl
            cargo zigbuild --release --target aarch64-unknown-linux-musl
            cargo zigbuild --release --target x86_64-pc-windows-gnullvm
            cargo zigbuild --release --target x86_64-apple-darwin
            cargo zigbuild --release --target aarch64-apple-darwin
            mkdir -p dist
            file=flb
            file_prefix=dist/${file}-${VERSION}-
            cp -a target/x86_64-unknown-linux-musl/release/${file} ${file_prefix}x86_64-unknown-linux-musl
            cp -a target/aarch64-unknown-linux-musl/release/${file} ${file_prefix}aarch64-unknown-linux-musl
            cp -a target/x86_64-pc-windows-gnullvm/release/${file}.exe ${file_prefix}x86_64-pc-windows-gnullvm.exe
            cp -a target/aarch64-pc-windows-gnullvm/release/${file}.exe ${file_prefix}aarch64-pc-windows-gnullvm.exe
            cp -a target/x86_64-apple-darwin/release/${file} ${file_prefix}x86_64-apple-darwin
            cp -a target/aarch64-apple-darwin/release/${file} ${file_prefix}aarch64-apple-darwin
          '
      - name: Show dist files
        run: ls -lh dist
      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-binaries
          path: dist/
          retention-days: 1

  publish_release:
    needs: cross_build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - uses: actions/download-artifact@v4
        with:
          name: dist-binaries
          path: dist/
      - name: Create release and upload assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ needs.cross_build.outputs.version }}" dist/* \
          --title "v${{ needs.cross_build.outputs.version }}" \
          --generate-notes

